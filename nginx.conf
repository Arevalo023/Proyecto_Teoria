server {
    listen 80;
    server_name _;

    # Directorio donde están los archivos del build de Angular
    root /usr/share/nginx/html;
    index index.html;

    # Esta parte es importante para las Single Page Applications (SPA)
    # Si el usuario recarga la página en una ruta específica, Nginx la redirige a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para archivos estáticos (imágenes, fuentes, etc.)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Compresión gzip para mejorar el rendimiento
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
}
